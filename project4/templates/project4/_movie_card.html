<h3 class="movie-title">{{ card.title }} <span class="movie-year">({{ card.year }})</span></h3>
<p class="movie-meta">{{ card.genres }}</p>
<p class="movie-meta">{{ card.duration }} min · {{ card.content_rating }} · IMDb {{ card.imdb_score }}</p>
<p class="movie-meta">Directed by {{ card.director }}</p>
<a class="movie-link" href="{{ card.link }}" target="_blank" rel="noopener">IMDb page ↗</a>
